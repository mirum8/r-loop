pipeline:
  - plan
  - implement

steps:
  plan:
    prompt: plan
    check: plan-file
    provider: claude
    model: opus
    effort: high
    timeout: 1h
    fallback:
      provider: codex
      model: sol
      effort: high
    reviewers:
      - provider: codex
        model: sol
        effort: high
    rounds: 2
    reviewTimeout: 20m
  implement:
    prompt: implement
    check: diff
    provider: claude
    model: opus
    effort: medium
    timeout: 4h
    fallback:
      provider: codex
      model: sol
      effort: medium
    reviewers:
      - provider: codex
        model: sol
        effort: high
      - name: ui
        provider: codex
        model: sol
        effort: high
        prompt: review-ui
        requires: .claude/skills/test-app/SKILL.md
      - name: security
        provider: codex
        model: sol
        effort: high
        prompt: review-security
    rounds: 3
    reviewTimeout: 45m
  milestone:
    prompt: milestone
    check: report
    provider: claude
    model: opus
    effort: medium
    timeout: 1h
  gate:
    prompt: gate
    check: report
    provider: claude
    model: sonnet
    effort: medium
    timeout: 30m

land:
  fixRounds: 1
  gateTimeout: 30m

watchdog:
  provider: claude
  model: opus
  effort: medium
  maxRestarts: 2
  allow:
  dialogs:
  blockerTimeout: 10m
  checkTimeout: 10m
  unblockTimeout: 2h
  triageTimeout: 2h
  stallGrace: 2m
  overtimeFactor: 2
  diffFactor: 3

intake:
  provider: claude
  model: sonnet
  effort: medium

unattended:
  allow:
    - deps
    - ports
    - locks
    - restart
    - retry
    - provider

notify:
  onHalt: ""
  onWarn: ""
  onDone: ""
